# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory$git_branch$git_status$fill$cmd_duration
$character"""

add_newline = false

[fill]
symbol = " "

[cmd_duration]
min_time = 0        # Minimum duration in ms before showing (2000 = 2s)
format = "[$duration]($style)"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
format = '([\[$ahead_behind\]]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""

[directory]
truncation_length = 3        # Number of parent folders to show (0 = full path)
truncate_to_repo = false # Stop truncating at the root of a git repo

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

